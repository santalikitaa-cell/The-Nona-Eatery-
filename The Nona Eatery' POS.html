<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kasir &amp; Stok</title>
<style>
/* ===== TEMA & DASAR ===== */
:root,[data-theme=terang]{--bg:#f3f5f9;--card:#ffffff;--text:#1b2433;--muted:#5b6678;--line:#d5dbe6;--accent:#2563eb;--input:#ffffff;
 --ok-bg:#d1fae5;--ok-fg:#065f46;--warn-bg:#fef3c7;--warn-fg:#92400e;--bad-bg:#fee2e2;--bad-fg:#991b1b}
[data-theme=gelap]{--bg:#0f1420;--card:#1a2133;--text:#e8ecf5;--muted:#9aa7bf;--line:#2c3650;--accent:#4f8cff;--input:#121827;
 --ok-bg:#064e3b;--ok-fg:#a7f3d0;--warn-bg:#78350f;--warn-fg:#fde68a;--bad-bg:#7f1d1d;--bad-fg:#fecaca}
[data-theme=laut]{--bg:#e4f3f7;--accent:#0e7490}
[data-theme=hutan]{--bg:#e8f3ea;--accent:#2f855a}
[data-theme=senja]{--bg:#fdeee3;--accent:#c2410c}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(900px 520px at 10% -8%,color-mix(in srgb,var(--accent) 45%,transparent),transparent 62%),radial-gradient(800px 520px at 105% 8%,rgba(168,85,247,.22),transparent 60%),linear-gradient(160deg,color-mix(in srgb,var(--accent) 16%,#0a0c14),#0d101c 55%,color-mix(in srgb,var(--accent) 10%,#090b12));background-attachment:fixed;color:var(--text);min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--main-img,none) center/cover no-repeat}
h1,h2,h3{margin:0}
h2{font-size:1.1rem}
small,.muted{color:var(--muted)}
/* ===== HEADER ===== */
header{position:sticky;top:0;z-index:30;color:#fff;background:var(--hdr-img,none) center/cover no-repeat,linear-gradient(135deg,color-mix(in srgb,var(--accent) 62%,#0b0d14),#0b0d14)}
header::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,var(--dim,.25));pointer-events:none}
header>*{position:relative}
.hwrap{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand h1{font-size:1.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{color:rgba(255,255,255,.85);display:block}
.logo{width:42px;height:42px;border-radius:10px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-weight:700;font-size:1.3rem;overflow:hidden;flex:none}
.logo img{width:100%;height:100%;object-fit:cover}
nav{display:flex;gap:4px;overflow-x:auto;padding:0 10px 8px}
nav button{flex:none;border:0;background:rgba(255,255,255,.14);color:#fff;padding:8px 14px;border-radius:999px;font:inherit;font-weight:600;cursor:pointer}
nav button.on{background:#fff;color:#111}
.nb{display:inline-block;min-width:20px;height:20px;line-height:20px;padding:0 5px;border-radius:10px;background:#dc2626;color:#fff;font-size:.75rem;text-align:center;margin-left:4px}
/* ===== LAYOUT ===== */
main{max-width:1200px;margin:0 auto;padding:14px}
.pane{display:none}.pane.on{display:block}
.card{background:var(--card);background:color-mix(in srgb,var(--card) calc(var(--alpha,.95)*100%),transparent);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.split{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:900px){.split{grid-template-columns:minmax(320px,.8fr) 1.7fr;align-items:start}#cartCard{order:-1;position:sticky;top:130px;max-height:calc(100vh - 150px);overflow-y:auto}}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.row>*{flex:1 1 150px}
.cards{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px}
.stat{background:var(--card);background:color-mix(in srgb,var(--card) calc(var(--alpha,.95)*100%),transparent);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-size:1.5rem}
/* ===== FORM & TOMBOL ===== */
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--input);color:var(--text);font:inherit}
input[type=color]{padding:2px;height:40px}
input[type=range]{padding:0}
label{display:block;font-weight:600;margin:8px 0 3px;font-size:.9rem}
.btn{border:0;background:var(--accent);color:#fff;padding:9px 14px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.bad{background:#dc2626;color:#fff}
.btn.light{background:rgba(255,255,255,.92);color:#111}
.hbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
#musicBtn.off{opacity:.65}
.btn.sm{padding:5px 9px;font-size:.85rem}
.btn:hover{filter:brightness(1.08)}
button:disabled,.btn:disabled{opacity:.5;cursor:not-allowed;filter:grayscale(.6);background-image:repeating-linear-gradient(45deg,transparent 0 6px,rgba(128,128,128,.28) 6px 12px)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 60%,#fff);outline-offset:1px}
/* ===== LENCANA ===== */
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.78rem;font-weight:700;white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok-fg)}
.badge.warn{background:var(--warn-bg);color:var(--warn-fg)}
.badge.bad{background:var(--bad-bg);color:var(--bad-fg)}
/* ===== KASIR ===== */
.menucard input[type=search]{margin-bottom:10px}
.cattabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:12px}
.cattabs button{flex:none;background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;font:inherit;font-size:.78rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.cattabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.pcard{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:96px;padding:12px 10px;text-align:center;overflow:hidden;background:var(--input) center/cover no-repeat;color:var(--text);border:1px solid var(--line);border-radius:12px;font:inherit;cursor:pointer;transition:transform .15s,box-shadow .15s}
.pcard:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.18)}
.pcard b{font-size:.95rem;line-height:1.2}
.pcard .pprice{font-size:.85rem;font-weight:700;color:var(--accent)}
.pcard .pbadge{font-size:.7rem}
.pcard.hasimg{min-height:150px;justify-content:flex-end;align-items:flex-start;text-align:left;color:#fff;border-color:transparent}
.pcard.hasimg::before{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,rgba(0,0,0,.78))}
.pcard.hasimg>*{position:relative}
.pcard.hasimg .pprice{color:#fff}
.pcard.hasimg>.pbadge{position:absolute;top:6px;right:6px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.pcard:disabled{filter:grayscale(1);opacity:.6}
.sigtag{position:absolute;top:6px;left:6px;padding:1px 8px;border-radius:999px;background:linear-gradient(135deg,#fde68a,#f59e0b);color:#78350f;font-size:.65rem;font-weight:800;letter-spacing:.03em;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.pcard.issig:not(.hasimg){padding-top:26px}
.pcard.hasimg>.sigtag{position:absolute}
.dayrow td{background:color-mix(in srgb,var(--accent) 14%,var(--card));font-weight:700;position:sticky;left:0}
.cartempty{display:grid;place-items:center;gap:10px;text-align:center;color:var(--muted);padding:30px 10px}
.cartempty .ico{width:54px;height:54px;border:2px solid var(--muted);border-radius:50%;display:grid;place-items:center;font-size:1.6rem}
.banner{background:#fef3c7;color:#78350f;border:1px solid #f59e0b;border-radius:12px;padding:10px 12px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.line{border-bottom:1px solid var(--line);padding:8px 0}
.line .top{display:flex;justify-content:space-between;gap:8px}
.qty{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
.qty .btn{padding:4px 11px}
.qty input{width:84px;padding:5px 8px}
.total{font-size:1.4rem;font-weight:800;display:flex;justify-content:space-between;margin:12px 0}
/* ===== TABEL ===== */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:.8rem;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);white-space:nowrap}
td.num,th.num{text-align:right}
td.act{white-space:nowrap}
.th{width:40px;height:40px;border-radius:8px;object-fit:cover;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 18%,var(--card));color:var(--accent);font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips .btn.on{background:var(--accent);color:#fff}
.alertbox{border:1px solid #f59e0b;background:var(--warn-bg);color:var(--warn-fg);border-radius:12px;padding:12px;margin-bottom:14px}
.alertbox li{margin:6px 0}
/* ===== MODAL & TOAST ===== */
#modal{display:none;position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);align-items:center;justify-content:center;padding:14px}
#modal.open{display:flex}
#modal .box{background:var(--card);color:var(--text);border-radius:14px;padding:16px;width:100%;max-width:460px;max-height:92vh;overflow:auto}
#toasts{position:fixed;left:0;right:0;bottom:14px;z-index:70;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 10px}
.toast{pointer-events:auto;max-width:520px;padding:10px 14px;border-radius:10px;color:#fff;background:#1f2937;box-shadow:0 4px 16px rgba(0,0,0,.3);font-weight:600}
.toast.ok{background:#047857}.toast.warn{background:#b45309}.toast.bad{background:#b91c1c}
.themes{display:flex;gap:6px;flex-wrap:wrap}
footer{text-align:center;padding:16px;color:var(--muted);font-size:.85rem}
.card,.stat{box-shadow:0 8px 28px rgba(0,0,0,.28);border-color:rgba(255,255,255,.08)}
footer{color:rgba(255,255,255,.6)}
/* ===== SHIFT & STRUK ===== */
.shiftbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border-left:5px solid var(--accent)}
.sumtbl td{border:0;padding:3px 0}
.rcptwrap{background:#fff;color:#000;border:1px solid var(--line);border-radius:8px;padding:6px;margin:10px 0;max-height:55vh;overflow:auto}
.rcpt{font-family:"Courier New",monospace;font-size:12px;line-height:1.35;width:100%;max-width:300px;margin:0 auto;color:#000;background:#fff;padding:8px}
.rcpt .rl{display:flex;justify-content:space-between;gap:8px}
.rcpt .rc{text-align:center}
.rcpt .hr{border-top:1px dashed #000;margin:6px 0}
.rcpt .orderno{background:#000;color:#fff;text-align:center;padding:4px 0;margin:8px 0 2px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rcpt .orderno small{display:block;font-size:10px;font-weight:700;letter-spacing:.2em;color:#fff}
.rcpt .orderno b{display:block;font-size:30px;letter-spacing:.12em;line-height:1.1}
.rcpt .qrrow{display:flex;justify-content:space-around;gap:6px;margin-top:8px}
.rcpt .qrbox{text-align:center;font-size:10px;line-height:1.2}
.rcpt .qrbox svg{width:108px;height:108px;display:block;margin:0 auto 2px}
.rcpt .rlogo{display:block;max-width:130px;max-height:72px;margin:0 auto 4px;filter:grayscale(1) contrast(1.3)}
.qrp{background:#fff;color:#111;padding:8px;border-radius:10px;text-align:center;overflow-wrap:anywhere}
.qrp small{display:block;color:#333}
.rcpt .wifi{border:1px dashed #000;padding:6px;text-align:center;margin-top:6px}
#printArea{display:none}
/* ===== PRINTER ANIMASI ===== */
#printer{display:none;position:fixed;right:14px;bottom:14px;z-index:45;width:min(330px,calc(100vw - 28px));filter:drop-shadow(0 8px 22px rgba(0,0,0,.35))}
#printer.open{display:block;animation:prnIn .35s ease-out}
.prn-win{max-height:min(58vh,520px);overflow:hidden;padding:0 12px}
.prn-win.done{overflow-y:auto}
.paper{background:#fff;color:#000;padding-bottom:8px;-webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/12px 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/12px 100%}
.paper .rcpt{max-width:none}
.prn-body{position:relative;z-index:2;margin-top:-2px;padding:0 12px 12px;border-radius:14px;background:linear-gradient(#444b5a,#262b36);color:#fff}
.slot{height:7px;margin:0 -2px 10px;border-radius:4px;background:#0b0d12;box-shadow:inset 0 2px 3px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.18)}
.prn-top{display:flex;align-items:center;gap:8px;font-size:.78rem;font-weight:700;letter-spacing:.06em}
.led{width:9px;height:9px;border-radius:50%;background:#22c55e;box-shadow:0 0 6px #22c55e;flex:none}
#printer.busy .led{background:#f59e0b;box-shadow:0 0 6px #f59e0b;animation:ledb .3s infinite}
#printer.busy .prn-body{animation:jig .12s infinite}
.prn-btns{display:flex;gap:8px;margin-top:10px}
.prn-btns .btn{flex:1}
.prn-body .btn.sec{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.28)}
@keyframes feed{from{transform:translateY(var(--from,100%))}to{transform:translateY(0)}}
@keyframes tear{to{transform:translateY(-130%) rotate(5deg);opacity:0}}
@keyframes prnIn{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes ledb{50%{opacity:.25}}
@keyframes jig{50%{transform:translateX(.7px)}}
@media print{
  body>*{display:none!important}
  body>#printArea{display:block!important}
  body{background:none!important}
  body::before{display:none}
  @page{margin:3mm}
  #printArea .rcpt{max-width:72mm;padding:0}
}
</style>
</head>
<body>
<header id="hdr">
  <div class="hwrap">
    <div class="brand"><span class="logo" id="logo" data-dyn></span><div><h1 id="bizName"></h1><small id="grpName"></small></div></div>
    <div class="hbtns"><button class="btn light" id="musicBtn" data-act="toggleMusic" title="Nyalakan / matikan musik" aria-label="Musik">🎵 Musik</button><button class="btn light" data-act="saveHtmlData">💾 Simpan HTML</button></div>
  </div>
  <nav id="tabs">
    <button data-tab="kasir" class="on">Kasir</button>
    <button data-tab="master">Master Data</button>
    <button data-tab="stok">Stok <span class="nb" id="tabBadge" hidden></span></button>
    <button data-tab="riwayat">Riwayat &amp; Excel</button>
    <button data-tab="setting">Pengaturan</button>
  </nav>
</header>

<main>
  <!-- KASIR -->
  <section id="tab-kasir" class="pane on">
    <div id="banner" data-dyn></div>
    <div id="shiftBox" data-dyn></div>
    <div class="split" id="posArea">
      <div class="card menucard">
        <input id="q" type="search" placeholder="Cari menu…" autocomplete="off">
        <div id="catTabs" class="cattabs" role="tablist" data-dyn></div>
        <div id="grid" class="grid" data-dyn></div>
      </div>
      <div class="card" id="cartCard"><h2>Pesanan</h2><div id="cart" data-dyn></div></div>
    </div>
  </section>
  <!-- MASTER -->
  <section id="tab-master" class="pane"><div class="card" id="masterBox" data-dyn></div></section>
  <!-- STOK -->
  <section id="tab-stok" class="pane"><div id="stokBox" data-dyn></div></section>
  <!-- RIWAYAT -->
  <section id="tab-riwayat" class="pane"><div id="riwayatBox" data-dyn></div></section>
  <!-- PENGATURAN -->
  <section id="tab-setting" class="pane"><div id="settingBox" data-dyn></div></section>
</main>
<footer id="foot" data-dyn></footer>

<div id="modal" data-dyn></div>
<div id="toasts" data-dyn></div>
<div id="printer" data-dyn></div>
<div id="printArea" data-dyn></div>
<input type="file" id="filePick" accept="image/*" hidden>

<script id="seed" type="application/json">{}</script>

<script>
"use strict";
/* ===== UTIL ===== */
const LS_KEY = 'pos_kasir_stok_v1';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = Number(v); return isFinite(n) ? n : 0; };
const rp = n => 'Rp ' + Math.round(num(n)).toLocaleString('id-ID');
const pad = (n, l = 2) => String(n).padStart(l, '0');
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36);
const safeImg = s => (typeof s === 'string' && /^data:image\//.test(s)) ? s : '';
function nowStr() {
  const d = new Date();
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
}
const PAYMENTS = ['Tunai', 'QRIS', 'Transfer', 'Debit', 'E-Wallet'];
const THEMES = [['terang','Terang'],['gelap','Gelap'],['laut','Laut'],['hutan','Hutan'],['senja','Senja']];
const KET_MASUK = ['Pembelian supplier', 'Retur pelanggan', 'Koreksi'];
const KET_KELUAR = ['Rusak', 'Kedaluwarsa', 'Hilang', 'Retur ke supplier', 'Koreksi'];

let state = null;
const ui = { cat: 'Semua', logFilter: 'Semua', pick: '', tmpFoto: '', riwDate: '' };

/* ===== DATA AWAL ===== */
function defaultState() {
  const mk = (nama, kategori, harga, stok, min, reorder, sig) => ({ id: uid(), nama, kategori, harga, stok, min, reorder, foto: '', sig: !!sig });
  const products = [
    mk('Betutu Signature', 'Makanan', 85000, 15, 4, 12, true),
    mk('Nona Signature', 'Minuman', 75000, 15, 4, 12, true),
    mk('Nona Beef Steak', 'Makanan', 120000, 12, 3, 10, true),
    mk('Tiramisu Amore', 'Dessert', 45000, 15, 4, 12, true),
    mk('Nasi Ayam Geprek', 'Makanan', 28000, 25, 6, 20),
    mk('Nasi Goreng Nona', 'Makanan', 30000, 25, 6, 20),
    mk('Mie Goreng Spesial', 'Makanan', 26000, 20, 6, 18),
    mk('Soto Ayam', 'Makanan', 25000, 20, 6, 18),
    mk('Ayam Bakar Taliwang', 'Makanan', 35000, 18, 5, 15),
    mk('Pudding Cokelat', 'Dessert', 18000, 20, 5, 15),
    mk('Es Krim Vanilla', 'Dessert', 15000, 25, 6, 20),
    mk('Pisang Caramel', 'Dessert', 20000, 18, 5, 15),
    mk('Es Teh Manis', 'Minuman', 8000, 50, 12, 40),
    mk('Es Jeruk', 'Minuman', 12000, 40, 10, 30),
    mk('Kopi Susu Nona', 'Minuman', 22000, 40, 10, 30),
    mk('Matcha Latte', 'Minuman', 26000, 30, 8, 24),
    mk('Lemon Tea', 'Minuman', 15000, 30, 8, 24),
    mk('Kentang Goreng', 'Cemilan', 18000, 25, 6, 20),
    mk('Pisang Goreng', 'Cemilan', 15000, 25, 6, 20),
    mk('Tahu Crispy', 'Cemilan', 14000, 25, 6, 20)
  ];
  const t = nowStr();
  return {
    savedAt: Date.now(),
    settings: { nama: 'The Nona Eatery', kelompok: 'Kelompok 1 – Sistem Informasi Manajemen', logo: '', diskonJenis: 'persen',
      bgHeader: '', bgMain: '', dim: 25, alpha: 95, theme: '', accent: '', wifiNama: 'The Nona Eatery', wifiSandi: 'NonaNona22', strukPesan: 'Terima kasih, selamat menikmati!', kasir: '', diskonAuto: true, diskonAutoMin: 200000, diskonAutoPersen: 5, pengaduanUrl: 'https://example.com/pengaduan', pengaduanTeks: 'Pengaduan & saran', musik: true, musikVol: 35, sfx: true },
    products,
    sales: [],
    cart: [],
    menuV: 5, shift: null, shifts: [], order: { pelanggan: '', meja: '', jenis: 'Dine In', diskon: 0 },
    stockLog: products.map(p => ({ id: uid(), tgl: t, pid: p.id, nama: p.nama, tipe: 'Masuk', qty: p.stok, ket: 'Stok awal', ref: '' })),
    pay: 'Tunai'
  };
}
/* Data lama tanpa field stok tetap terbaca (stok 0, minimum 0) */
function normalize(s) {
  const d = defaultState();
  s = s || {};
  const st = Object.assign({}, d.settings, s.settings || {});

let prnHtml = '', prnTimer = 0, prnSeq = 0;
function finishFeed() {
  const pr = $('#printer'), paper = $('#paper'), win = $('#prnWin'); if (!pr || !paper) return;
  paper.style.animation = ''; win.classList.add('done'); win.scrollTop = 0; pr.classList.remove('busy');

function showPrinter(html, title) {
  const pr = $('#printer'); prnHtml = html; clearTimeout(prnTimer);
  pr.className = ''; void pr.offsetWidth;
  pr.innerHTML = '<div class="prn-win" id="prnWin"><div class="paper" id="paper">' + html + '</div></div>' +
    '<div class="prn-body"><div class="slot"></div><div class="prn-top"><span class="led"></span><span>' + esc(title) + '</span></div>' +
    '<div class="prn-btns"><button class="btn sm" data-act="prnPrint">Cetak</button><button class="btn sm sec" data-act="prnTake">Ambil struk</button></div></div>';
  pr.className = 'open busy';
  const paper = $('#paper'), win = $('#prnWin'), seq = ++prnSeq;
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  paper.style.visibility = 'hidden'; // tunggu gambar (logo) siap agar ukuran kertas pasti
  const start = () => {
    if (seq !== prnSeq || $('#paper') !== paper) return;
    paper.style.visibility = '';
    if (reduce) return finishFeed();
    const hgt = win.clientHeight, dur = Math.min(4.5, Math.max(1.6, hgt / 150)), steps = Math.max(12, Math.round(hgt / 7)); // gerak per langkah seperti printer
    paper.style.setProperty('--from', hgt + 'px');
    paper.style.animation = 'feed ' + dur + 's steps(' + steps + ', end) forwards';
    paper.addEventListener('animationend', finishFeed, { once: true });
  };
  Promise.all([...paper.querySelectorAll('img')].map(i => (i.decode ? i.decode() : Promise.resolve()).catch(() => {}))).then(start);
}
function takeReceipt() {
  const pr = $('#printer'), paper = $('#paper'); if (!paper) { pr.className = ''; return; }
  paper.removeEventListener('animationend', finishFeed); pr.classList.remove('busy');
  paper.style.animation = 'tear .55s ease-in forwards';

}

  try { if (!blob) blob = buildXlsx(specs); } // 2) pembuat bawaan tanpa internet
  catch (e) { blob = null; }
  if (blob) { download(fname + '.xlsx', blob); return toast('File Excel diunduh: ' + fname + '.xlsx', 'ok'); }

/* ===== SUARA: musik calm, klik tombol, transaksi berhasil (dibuat dengan Web Audio, tanpa file) ===== */
const SFX = (() => {
  let ac = null, master, musicVol, sfxOut, bus, timer = 0, on = false, nextT = 0, bar = 0;
  const CH = [[130.81, 196, 246.94, 329.63], [110, 164.81, 196, 261.63], [87.31, 130.81, 174.61, 220], [98, 146.83, 196, 246.94]]; // Cmaj7, Am7, Fmaj7, G6
  const PENTA = [523.25, 587.33, 659.25, 783.99, 880, 1046.5];
  function ctx() {
    if (!ac) {
      const C = window.AudioContext || window.webkitAudioContext; if (!C) return null;
      ac = new C(); master = ac.createGain(); master.gain.value = 0.9; master.connect(ac.destination);
      musicVol = ac.createGain(); musicVol.gain.value = 0; musicVol.connect(master);
      sfxOut = ac.createGain(); sfxOut.gain.value = 0.55; sfxOut.connect(master);
      bus = ac.createGain(); bus.connect(musicVol); // gema lembut agar terasa luas
      const d = ac.createDelay(1.5); d.delayTime.value = 0.46; const fb = ac.createGain(); fb.gain.value = 0.38;
      const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1600;
      bus.connect(d); d.connect(lp); lp.connect(fb); fb.connect(d); lp.connect(musicVol);
    }
    if (ac.state === 'suspended') ac.resume().catch(() => {});
    return ac;
  }
  function tone(f, t, dur, o) {
    o = o || {}; const osc = ac.createOscillator(), g = ac.createGain();
    osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(f, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + dur);
    const a = o.attack == null ? 0.01 : o.attack, v = o.vol == null ? 0.2 : o.vol;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(o.dest || sfxOut); osc.start(t); osc.stop(t + dur + 0.05);
  }
  function scheduleBar(t) {
    const c = CH[bar % CH.length], L = 6.4;
    c.forEach((f, i) => { // pad: nada panjang, masuk perlahan
      tone(f, t + i * 0.08, L + 1.8, { type: 'sine', vol: 0.07, attack: 2.2, dest: bus });
      tone(f * 2.003, t + i * 0.08, L + 1.8, { type: 'triangle', vol: 0.018, attack: 2.6, dest: bus });
    });
    const n = 3 + Math.floor(Math.random() * 2); let last = -1; // melodi pentatonik acak, pelan
    for (let k = 0; k < n; k++) {
      let ix; do { ix = Math.floor(Math.random() * PENTA.length); } while (ix === last); last = ix;
      tone(PENTA[ix], t + 0.8 + k * (L - 1.2) / n + Math.random() * 0.4, 2.6, { type: 'sine', vol: 0.05, attack: 0.04, dest: bus });
    }
    bar++;
  }
  function loop() {
    if (!on || !ac) return;
    if (nextT < ac.currentTime + 0.1) nextT = ac.currentTime + 0.1;
    while (nextT < ac.currentTime + 7) { scheduleBar(nextT); nextT += 6.4; }
    timer = setTimeout(loop, 2000);
  }
  function level() { return (state.settings.musikVol || 0) / 100; }
  return {
    startMusic() {
      if (!state.settings.musik || on) return; if (!ctx()) return;
      on = true; musicVol.gain.cancelScheduledValues(ac.currentTime); musicVol.gain.setTargetAtTime(level(), ac.currentTime, 1.2); loop();
    },
    stopMusic() {
      if (!on) return; on = false; clearTimeout(timer);
      if (ac) { musicVol.gain.cancelScheduledValues(ac.currentTime); musicVol.gain.setTargetAtTime(0, ac.currentTime, 0.4); }
    },
    setVol() { if (ac && on) musicVol.gain.setTargetAtTime(level(), ac.currentTime, 0.2); },
    click() { // bunyi "tek" tombol ditekan
      if (!state.settings.sfx || !ctx()) return; const t = ac.currentTime;

    },
    success() { // denting naik tanda transaksi berhasil
      if (!state.settings.sfx || !ctx()) return; const t = ac.currentTime + 0.02;
      [659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => {
        const d = i === 3 ? 1.3 : 0.45, st = t + i * 0.12;

    suspend() { if (ac && ac.state === 'running') ac.suspend().catch(() => {}); },
    resume() { if (ac && ac.state === 'suspended' && (on || state.settings.sfx)) ac.resume().catch(() => {}); },
    get playing() { return on; }
  };
})();

  else if (t.id === 'riwDate') { ui.riwDate = t.value; renderRiwayat(); }
  else if (t.id === 'payM') { state.pay = t.value; save(); }
  else if (t.id === 'sDisc') { state.settings.diskonJenis = t.value; state.cart.forEach(c => { c.disc = 0; }); state.order.diskon = 0; save(); renderCart(); toast('Jenis diskon diubah; diskon di keranjang direset.', 'warn'); }
  else if (t.dataset && t.dataset.disc) {
    const c = state.cart.find(x => x.pid === t.dataset.disc), p = c && prod(c.pid); if (!c || !p) return;
    let v = Math.max(0, num(t.value));
    if (state.settings.diskonJenis === 'persen' && v > 100) { v = 100; toast('Diskon maksimal 100%.', 'warn'); }
    if (state.settings.diskonJenis === 'rupiah' && v > p.harga * c.qty) { v = p.harga * c.qty; toast('Diskon tidak boleh melebihi harga item.', 'warn'); }
    c.disc = v; save(); renderCart();
  }
});
$('#filePick').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const t = ui.pick, s = state.settings;
  try {
    if (t === 'logo') { s.logo = await resizeImage(f, 256, 0.9, 'image/png'); save(); applyTheme(); renderHeader(); }
    else if (t === 'hdr') { s.bgHeader = await resizeImage(f, 1600, 0.65); save(); applyTheme(); }
    else if (t === 'bg') { s.bgMain = await resizeImage(f, 1600, 0.7); save(); applyTheme(); }
    else if (t === 'modalFoto') { ui.tmpFoto = await resizeImage(f, 600, 0.8); paintModalFoto(($('#modal input[name=nama]') || {}).value || '?'); }
    else if (t.startsWith('prod:')) { const p = prod(t.slice(5)); if (p) { p.foto = await resizeImage(f, 600, 0.8); save(); renderAll(); toast('Foto produk diganti.', 'ok'); } }
  } catch (err) { toast(err.message || 'Gagal memproses gambar.', 'bad'); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal').classList.contains('open')) closeModal(); });

/* ===== MULAI ===== */
load();
renderAll();
updateMusicUI();
showTab('kasir');
if (lowList().length) toast(lowList().length + ' produk stok menipis/habis. Segera pesan ulang.', 'warn');
</script>
</body>
